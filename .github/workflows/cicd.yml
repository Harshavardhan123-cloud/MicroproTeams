name: MicroproTeams CI/CD Pipeline

on:
  push:
    branches:
      - Harshavardhan_Code
      - Testing
      - main
  pull_request:
    branches:
      - Harshavardhan_Code
      - Testing
      - main
  workflow_dispatch:
    inputs:
      promote_target:
        description: 'Select environment to promote to (run tests only if None)'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'Testing'
          - 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Backend Unit & Integration Tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Pytest & Security)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-core.txt
          pip install pytest pytest-asyncio passlib[bcrypt] python-jose[cryptography] PyNaCl

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: ./backend
          JWT_SECRET: ci_jwt_secret_key_1234567890_super_secret_testing
        run: |
          pytest backend/tests/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend Linting & Production Build Check
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Lint & Next.js Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Next.js Production Build Test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:8001
          NEXT_PUBLIC_MEDIASOUP_URL: http://localhost:3000
        run: |
          cd frontend
          npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Docker Services Build Validation
  # ─────────────────────────────────────────────────────────────────────────────
  docker-ci:
    name: Docker Infrastructure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Auto-Promote from Harshavardhan_Code -> Testing
  # ─────────────────────────────────────────────────────────────────────────────
  promote-to-testing:
    name: Promote Harshavardhan_Code -> Testing
    needs: [backend-ci, frontend-ci, docker-ci]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_target == 'Testing' && github.ref_name == 'Harshavardhan_Code'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Harshavardhan_Code into Testing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin Testing
          git checkout Testing
          git merge --no-ff Harshavardhan_Code -m "ci(auto-merge): promote passing build from Harshavardhan_Code to Testing [skip ci]"
          git push origin Testing

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Auto-Promote from Testing -> main (Production Release)
  # ─────────────────────────────────────────────────────────────────────────────
  promote-to-main:
    name: Promote Testing -> main (Production)
    needs: [backend-ci, frontend-ci, docker-ci]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_target == 'main' && github.ref_name == 'Testing'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Testing into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff Testing -m "ci(auto-merge): promote verified Testing release to main [skip ci]"
          git push origin main
