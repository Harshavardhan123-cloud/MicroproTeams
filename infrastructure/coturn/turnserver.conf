# ─────────────────────────────────────────────────────────────────────────────
#  Micropro Commute — coturn (TURN/STUN relay)
#
#  Why this exists: mediasoup only ever hands out *host* candidates (its own
#  announced IPs). That is enough on a LAN or from a well-behaved home NAT,
#  but a phone on a mobile network usually sits behind carrier-grade NAT,
#  where nothing can be sent to the handset until the handset has punched a
#  hole — and CGNAT frequently refuses to keep that hole open for a third
#  party. A relay in the middle fixes it: the phone allocates a public
#  address on this server and both sides talk to that.
#
#  What is NOT in this file, and why:
#    realm, static-auth-secret, listening-port, min-port, max-port and
#    external-ip are all supplied as command-line flags by the `coturn`
#    service in docker-compose.yml, because they are environment-driven and
#    coturn config files have no variable interpolation. coturn gives
#    command-line options precedence over the config file, so do not also
#    set them here — you would only create two sources of truth.
#    The shared secret in particular must never be committed to this file.
# ─────────────────────────────────────────────────────────────────────────────

# ── Authentication ──────────────────────────────────────────────────────────
# The TURN REST API / long-term-credential scheme (the standard way to hand a
# browser or phone a credential that expires on its own). There are no user
# accounts on this server at all: the SFU mints, per WebRTC transport,
#
#     username   = "<unix-expiry-timestamp>:<userId>"
#     credential = base64( HMAC-SHA1( username, static-auth-secret ) )
#
# and returns it in the createWebRtcTransport ack (see backend/sfu/server.js,
# buildIceServers()). coturn recomputes the same HMAC to validate, and refuses
# the credential once the embedded timestamp is in the past — so a credential
# leaked out of a client is worthless within hours and revokes itself.
use-auth-secret

# Reject a request whose nonce is older than this (seconds). Keeps a captured
# nonce from being replayed for the whole life of the credential.
stale-nonce=600

# Send the FINGERPRINT attribute in TURN messages. WebRTC clients expect it.
fingerprint

# ── Relay behaviour ─────────────────────────────────────────────────────────
# Clients may *reach* this server over TCP (turn:...?transport=tcp is what
# gets through restrictive corporate firewalls), but a relayed allocation is
# always UDP. WebRTC never asks for a TCP allocation, so allowing one would
# only widen what this server can be abused to proxy.
no-tcp-relay

# Never relay to multicast addresses.
no-multicast-peers

# The admin telnet CLI would bind port 5766. This container runs with
# network_mode: host, so that port would be exposed on the host itself.
no-cli

# ── TLS ─────────────────────────────────────────────────────────────────────
# Off by default: turns:// needs a real certificate for a real hostname, which
# this repo does not provision. To enable it, drop the two lines below, mount
# your cert/key into the container, and add to the coturn service's command:
#     --cert=/etc/coturn/certs/fullchain.pem
#     --pkey=/etc/coturn/certs/privkey.pem
# then set TURN_TLS_ENABLED=true and TURN_HOST=<the certificate's hostname>
# in .env so the SFU advertises the turns: URL to clients.
no-tls
no-dtls

# ── Abuse limits ────────────────────────────────────────────────────────────
# A media call needs 2 allocations per participant (mediasoup uses one
# transport per direction), so 12 leaves generous headroom per user while
# still capping a single credential from opening thousands of relays.
user-quota=12
total-quota=1200

# ── Peer allow/deny ─────────────────────────────────────────────────────────
# An open TURN server is a general-purpose UDP proxy, and one that can reach
# private address space is a way into the network it is hosted on. Deny every
# non-routable range so this relay can only ever forward to the public
# internet.
#
# ⚠ IMPORTANT for LAN and single-host deployments: the peer a client relays to
#   is the SFU's *announced* IP. If SFU_ANNOUNCED_IP / SFU_PUBLIC_IP is a
#   private address (the compose default is 127.0.0.1, and a LAN test box is
#   typically 192.168.x.x), every relayed packet is blocked by the rules
#   below and calls will fail with ICE stuck in "checking". Punch a hole for
#   exactly that one address rather than deleting the deny list — in .env:
#       TURN_EXTRA_ARGS=--allowed-peer-ip=192.168.1.147
#   allowed-peer-ip takes precedence over denied-peer-ip.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ── Process ─────────────────────────────────────────────────────────────────
# The official coturn image runs as nobody:nogroup, which cannot write the
# default /var/run/turnserver.pid.
pidfile=/var/tmp/turnserver.pid
