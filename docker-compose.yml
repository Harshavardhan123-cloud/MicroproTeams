
services:
  postgres:
    image: postgres:16-alpine
    container_name: teams_postgres
    restart: always
    environment:
      POSTGRES_USER: teams_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teams_password_secret}
      POSTGRES_DB: teams_db
    # Not published to the host — only other containers on the compose
    # network need to reach it. Add "5432:5432" back if you need a local
    # client (e.g. psql, pgAdmin) connected directly.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teams_user -d teams_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teams_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: teams_minio
    restart: always
    ports:
      # 9001 (web console) kept published since it's a legitimate admin UI;
      # 9000 (the S3 API itself) is only needed by other containers.
      - "9001:9001"
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teams_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://teams_user:${POSTGRES_PASSWORD:-teams_password_secret}@postgres:5432/teams_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-UX2uSYPervxO3Ysrml5wILaUEfEw-HCJKEeUypWMMSyZiQuVFgLQT3iBy49xNMGl}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-0JbcYNzvNbVBAFUMgbnHYTrlmRY2feXVjXwhPCTBHxd9bCqnOA9IEn05jevGlUOd}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=teams-uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      - MAX_FILE_UPLOAD_SIZE_MB=${MAX_FILE_UPLOAD_SIZE_MB:-100}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sfu:
    build:
      context: ./backend/sfu
      dockerfile: Dockerfile
    container_name: teams_sfu
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET:-UX2uSYPervxO3Ysrml5wILaUEfEw-HCJKEeUypWMMSyZiQuVFgLQT3iBy49xNMGl}
      - SFU_ANNOUNCED_IP=${SFU_ANNOUNCED_IP:-127.0.0.1}
      # TURN relay coordinates. The SFU doesn't talk to coturn at all — it
      # mints a short-lived HMAC credential for it and ships that to clients
      # in the createWebRtcTransport ack, so all it needs is the same shared
      # secret and the address clients should dial. Leave TURN_SECRET unset
      # and the SFU returns the STUN-only ICE list it always has.
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_HOST=${TURN_HOST:-}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_TLS_PORT=${TURN_TLS_PORT:-5349}
      - TURN_TLS_ENABLED=${TURN_TLS_ENABLED:-false}
      - TURN_CREDENTIAL_TTL=${TURN_CREDENTIAL_TTL:-14400}
      # Both empty by default, which selects the built-in lists. Set either to
      # point clients at a managed/third-party ICE service instead.
      - STUN_URLS=${STUN_URLS:-}
      - TURN_URLS=${TURN_URLS:-}
    # mediasoup needs a wide UDP port range (40000-49999) reachable for RTP
    # media, which host networking handles far more simply than publishing
    # 10,000 individual container ports. Linux-only; Docker Desktop
    # (Mac/Windows) doesn't support host networking the same way.
    network_mode: host

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: teams_coturn
    restart: always
    volumes:
      - ./infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Host networking for the same reason as sfu above, and one more: a relay
    # gives every allocation its own UDP port out of a wide range, and Docker's
    # userland proxy would rewrite the source address coturn hands back to
    # clients — breaking the very relay this service exists to provide.
    # Linux-only, same Docker Desktop caveat as sfu.
    #
    # ⚠ The relay range MUST NOT overlap mediasoup's 40000-49999: both
    #   processes share the host's network stack, so an overlap is a race for
    #   the same UDP ports. 50000-59999 sits immediately above it.
    network_mode: host
    # turnserver.conf holds the static policy; these are the parts that have
    # to come from the environment, and coturn config files cannot interpolate
    # env vars. `${TURN_SECRET:+...}` drops the flag entirely when the var is
    # unset, so a deployment that hasn't configured TURN still comes up — the
    # relay just refuses every allocation (fail closed) while the SFU keeps
    # returning STUN-only ICE. The secret is visible in `ps` on the host; if
    # that matters, put `static-auth-secret=` in turnserver.conf instead and
    # keep that file out of git.
    command: >-
      -c /etc/coturn/turnserver.conf
      --log-file=stdout
      --realm=${TURN_REALM:-micropro.commute}
      --listening-port=${TURN_PORT:-3478}
      --min-port=${TURN_RELAY_MIN_PORT:-50000}
      --max-port=${TURN_RELAY_MAX_PORT:-59999}
      ${TURN_SECRET:+--static-auth-secret=$TURN_SECRET}
      ${TURN_EXTRA_ARGS:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teams_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: teams_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # The sfu service runs with network_mode: host (see above), so it isn't
    # reachable by container name on the compose network — this resolves the
    # Docker host's IP from inside nginx's own container instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend
      - sfu

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
