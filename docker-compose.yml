version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teams_postgres
    restart: always
    environment:
      POSTGRES_USER: teams_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: teams_db
    # Not published to the host — only other containers on the compose
    # network need to reach it. Add "5432:5432" back if you need a local
    # client (e.g. psql, pgAdmin) connected directly.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teams_user -d teams_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teams_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    container_name: teams_minio
    restart: always
    ports:
      # 9001 (web console) kept published since it's a legitimate admin UI;
      # 9000 (the S3 API itself) is only needed by other containers.
      - "9001:9001"
    expose:
      - "9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teams_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://teams_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/teams_db
      - REDIS_URL=redis://redis:6379/0
      # JWT_REFRESH_SECRET used to be missing here entirely, silently falling
      # back to a value the backend generates itself per-process — which
      # breaks refresh tokens on every container restart/redeploy.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env — see .env.example}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env — see .env.example}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=teams-uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sfu:
    build:
      context: ./backend/sfu
      dockerfile: Dockerfile
    container_name: teams_sfu
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env — see .env.example}
      - SFU_ANNOUNCED_IP=${SFU_ANNOUNCED_IP:-127.0.0.1}
    # mediasoup needs a wide UDP port range (40000-49999) reachable for RTP
    # media, which host networking handles far more simply than publishing
    # 10,000 individual container ports. Linux-only; Docker Desktop
    # (Mac/Windows) doesn't support host networking the same way.
    network_mode: host

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teams_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: teams_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # The sfu service runs with network_mode: host (see above), so it isn't
    # reachable by container name on the compose network — this resolves the
    # Docker host's IP from inside nginx's own container instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend
      - sfu

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
